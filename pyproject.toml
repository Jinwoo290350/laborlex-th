[project]
name = "laborlex-th"
version = "0.1.0"
description = "Thai labor law legal agent (system-controlled reasoning)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "pythainlp>=5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "google-genai>=2.25.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "FlagEmbedding>=1.2", "bm25s>=0.2"]
agent = ["langgraph>=0.2", "google-genai>=1.0", "httpx>=0.27", "tenacity>=8.3"]
app = ["fastapi>=0.111", "uvicorn>=0.30", "streamlit>=1.36"]
eval = ["pandas>=2.2", "openpyxl>=3.1", "scikit-learn>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
files = ["src/agent", "src/calc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
