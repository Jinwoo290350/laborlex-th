    question: นายจ้างได้ทำการเลิกจ้างลูกจ้างตามกฎหมายหรือไม่
    citation_keys:
    - LPA2541:70:2
  - id: '3'
    question: นายจ้างเลิกจ้างลูกจ้างซึ่งเป็นหญิงเพราะเหตุมีครรภ์อันเป็นการต้องห้ามตามกฎหมายหรือไม่
    citation_keys:
    - LPA2541:43:1
  - id: '4'
    question: นายจ้างบอกเลิกสัญญาจ้างโดยไม่บอกกล่าวล่วงหน้าตามระยะเวลาที่กำหนดในกฎหมาย ซึ่งทำให้นายจ้างมีหน้าที่ต้องจ่ายเงินแทนการบอกกล่าวล่วงหน้าในวันที่ให้ลูกจ้างออกจากงานหรือไม่
    citation_keys:
    - LPA2541:17:2
    - LPA2541:17/1:1
  - id: '5'
    question: นายจ้างได้จ่ายค่าจ้าง ค่าล่วงเวลา ค่าทำงานในวันหยุด ค่าล่วงเวลาในวันหยุด และเงินที่นายจ้างมีหน้าที่ต้องจ่ายให้แก่ลูกจ้างภายในระยะเวลาที่กำหนดนับแต่วันที่เลิกจ้างตามกฎหมายหรือไม่
    citation_keys:
    - LPA2541:70:2
  - id: '6'
    question: การเลิกจ้างนั้นเข้าข้อยกเว้นที่ทำให้นายจ้างไม่ต้องจ่ายค่าชดเชยตามที่กฎหมายกำหนดไว้หรือไม่ และนายจ้างได้ระบุข้อเท็จจริงหรือแจ้งเหตุในขณะเลิกจ้างตามที่กฎหมายกำหนดเพื่อที่จะยกขึ้นอ้างได้หรือไม่
    citation_keys:
    - LPA2541:119:1
    - LPA2541:119:4
  common_pitfalls:
  - เข้าใจผิดว่านายจ้างสามารถเลิกจ้างลูกจ้างหญิงเพราะเหตุมีครรภ์ได้ ซึ่งขัดต่อ LPA2541:43:1
  - เข้าใจผิดว่านายจ้างสามารถจ่ายเงินค้างจ่ายเมื่อเลิกจ้างในรอบการจ่ายค่าจ้างปกติถัดไปได้ โดยไม่ได้จ่ายภายในระยะเวลาที่กำหนดนับแต่วันเลิกจ้างตาม
    LPA2541:70:2
  - เข้าใจผิดว่านายจ้างสามารถยกเหตุยกเว้นการจ่ายค่าชดเชยขึ้นอ้างในภายหลังได้ แม้ไม่ได้ระบุข้อเท็จจริงในหนังสือบอกเลิกสัญญาจ้างหรือไม่ได้แจ้งเหตุให้ลูกจ้างทราบในขณะเลิกจ้างตาม
    LPA2541:119:4
