    citation_keys:
    - LPA2541:119:1
  - id: misconduct_imprisonment
    question: ลูกจ้างได้รับโทษจำคุกตามคำพิพากษาถึงที่สุดให้จำคุกตาม LPA2541:119:1(6) โดยหากเป็นความผิดที่ได้กระทำโดยประมาทหรือความผิดลหุโทษ
      ต้องเป็นกรณีที่เป็นเหตุให้นายจ้างได้รับความเสียหายตาม LPA2541:119:3 หรือไม่
    citation_keys:
    - LPA2541:119:1
    - LPA2541:119:3
  common_pitfalls:
  - นายจ้างไม่ได้ระบุข้อเท็จจริงอันเป็นเหตุที่เลิกจ้างไว้ในหนังสือบอกเลิกสัญญาจ้างหรือไม่ได้แจ้งให้ลูกจ้างทราบในขณะที่เลิกจ้าง
    แต่ยกเหตุนั้นขึ้นอ้างในภายหลังเพื่อปฏิเสธการจ่ายค่าชดเชย ซึ่งต้องห้ามตาม [LPA2541:119:4]
  - นายจ้างเลิกจ้างโดยไม่จ่ายค่าชดเชยเนื่องจากลูกจ้างฝ่าฝืนข้อบังคับหรือคำสั่งทั่วไปที่ไม่ได้ร้ายแรง โดยไม่มีการตักเตือนเป็นหนังสือล่วงหน้า
    หรือใช้หนังสือเตือนที่สิ้นผลบังคับไปแล้วเกินระยะเวลาที่กำหนดใน [LPA2541:119:2]
  - นายจ้างเลิกจ้างโดยไม่จ่ายค่าชดเชยเมื่อลูกจ้างได้รับโทษจำคุกในความผิดลหุโทษหรือความผิดที่กระทำโดยประมาท โดยที่ความผิดนั้นไม่ได้ก่อให้เกิดความเสียหายแก่นายจ้างตาม
    [LPA2541:119:3]
  - นายจ้างเลิกจ้างโดยไม่จ่ายค่าชดเชยเนื่องจากลูกจ้างละทิ้งหน้าที่ โดยระยะเวลาที่ละทิ้งหน้าที่ไม่ครบจำนวนวันทำงานติดต่อกันตามที่กำหนดไว้ใน
    [LPA2541:119:1](5)
