    question: นายจ้างประสงค์จะย้ายสถานประกอบกิจการแห่งหนึ่งแห่งใดไปตั้ง ณ สถานที่ใหม่หรือย้ายไปยังสถานที่อื่นของนายจ้างหรือไม่
