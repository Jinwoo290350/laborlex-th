  - id: relocation_impact
    question: ลูกจ้างเห็นว่าการย้ายสถานประกอบกิจการดังกล่าวมีผลกระทบสำคัญต่อการดำรงชีวิตตามปกติของลูกจ้างหรือครอบครัวของลูกจ้างคนนั้นหรือไม่
    citation_keys:
    - LPA2541:120:3
  - id: employee_written_notification
    question: ลูกจ้างที่ไม่ประสงค์จะไปทำงาน ณ สถานประกอบกิจการแห่งใหม่ ได้แจ้งให้นายจ้างทราบเป็นหนังสือภายในระยะเวลาที่กำหนดนับแต่วันที่ปิดประกาศ
      หรือนับแต่วันที่ย้ายสถานประกอบกิจการในกรณีที่ไม่มีการปิดประกาศตาม LPA2541:120:3 หรือไม่
    citation_keys:
    - LPA2541:120:3
  - id: special_severance_payment
    question: นายจ้างได้จ่ายค่าชดเชยพิเศษให้แก่ลูกจ้างไม่น้อยกว่าอัตราค่าชดเชยที่ลูกจ้างพึงมีสิทธิได้รับตาม LPA2541:118:1
      หรือไม่
    citation_keys:
    - LPA2541:120:3
    - LPA2541:118:1
  - id: payment_timeline
    question: นายจ้างได้จ่ายค่าชดเชยพิเศษแทนการบอกกล่าวล่วงหน้าหรือค่าชดเชยพิเศษให้แก่ลูกจ้างภายในระยะเวลาที่กำหนดใน LPA2541:120:4
      นับแต่วันที่สัญญาจ้างสิ้นสุดลงหรือไม่
    citation_keys:
    - LPA2541:120:4
  - id: employer_disagreement_petition
    question: ในกรณีที่นายจ้างไม่เห็นด้วยกับเหตุผลของลูกจ้าง นายจ้างได้ยื่นคำร้องต่อคณะกรรมการสวัสดิการแรงงานภายในระยะเวลาที่กำหนดใน
      LPA2541:120:5 นับแต่วันที่ได้รับแจ้งเป็นหนังสือหรือไม่
    citation_keys:
    - LPA2541:120:5
  - id: restructuring_special_severance
    question: ในกรณีที่นายจ้างเลิกจ้างลูกจ้างเนื่องจากการปรับปรุงโครงสร้างองค์กรตามมาตรา 121 และลูกจ้างทำงานติดต่อกันเกินระยะเวลาที่กำหนดใน
      LPA2541:122:1 นายจ้างได้จ่ายค่าชดเชยพิเศษเพิ่มขึ้นตามอัตราและเงื่อนไขที่กำหนดใน LPA2541:122:1 และ LPA2541:122:2 หรือไม่
    citation_keys:
    - LPA2541:122:1
    - LPA2541:122:2
  - id: severance_exemption
    question: ลูกจ้างมีกรณีที่ทำให้นายจ้างไม่ต้องจ่ายค่าชดเชยเนื่องจากการกระทำความผิดหรือละทิ้งหน้าที่ตามที่ระบุใน LPA2541:119:1
      หรือไม่
    citation_keys:
    - LPA2541:119:1
  common_pitfalls:
  - เข้าใจผิดว่านายจ้างสามารถหักค่าชดเชยพิเศษเพื่อชำระหนี้อื่นใดนอกเหนือจากที่ระบุไว้ใน LPA2541:76:1 ได้โดยไม่ต้องได้รับความยินยอมจากลูกจ้าง
  - เข้าใจผิดว่าการคำนวณระยะเวลาทำงานเพื่อรับค่าชดเชยพิเศษเพิ่มเติมตาม LPA2541:122:2 เศษของระยะเวลาทำงานที่น้อยกว่าหรือเท่ากับจำนวนวันที่กำหนดในตัวบทสามารถปัดขึ้นเป็นหนึ่งปีได้
  - เข้าใจผิดว่านายจ้างสามารถยกเหตุเลิกจ้างโดยไม่จ่ายค่าชดเชยตาม LPA2541:119:1 ขึ้นอ้างในภายหลังได้ แม้ไม่ได้ระบุข้อเท็จจริงนั้นในหนังสือบอกเลิกสัญญาจ้างหรือไม่ได้แจ้งให้ลูกจ้างทราบในขณะเลิกจ้างตาม
    LPA2541:119:4
  - เข้าใจผิดว่าลูกจ้างที่ทำงานในโครงการเฉพาะที่มีกำหนดระยะเวลาแน่นอนตาม LPA2541:118:4 จะได้รับค่าชดเชยเมื่อสัญญาสิ้นสุดลงตามกำหนดเวลาตาม
    LPA2541:118:3
