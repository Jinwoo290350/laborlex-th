  elements:
  - id: '1'
    question: ผู้ทำงานมีสถานะเป็นลูกจ้างที่ตกลงทำงานให้นายจ้างเพื่อรับค่าจ้างตาม LPA2541:5:3 และ LPA2541:5:7 หรือไม่
    citation_keys:
    - LPA2541:5:3
    - LPA2541:5:7
  - id: '2'
    question: มีการเลิกจ้างโดยนายจ้างไม่ให้ลูกจ้างทำงานต่อไปและไม่จ่ายค่าจ้างให้เนื่องจากสิ้นสุดสัญญาจ้างหรือเหตุอื่น หรือเพราะนายจ้างไม่สามารถดำเนินกิจการต่อไปตาม
      LPA2541:118:2 หรือไม่
    citation_keys:
    - LPA2541:118:2
  - id: '3'
    question: การเลิกจ้างนั้นเป็นการเลิกจ้างตามกำหนดระยะเวลาการจ้างที่แน่นอนในสัญญาจ้างที่ทำเป็นหนังสือตั้งแต่เริ่มจ้างสำหรับงานเฉพาะตามเงื่อนไขใน
      LPA2541:118:3 และ LPA2541:118:4 หรือไม่
    citation_keys:
    - LPA2541:118:3
    - LPA2541:118:4
  - id: '4'
    question: ลูกจ้างกระทำการอันเป็นเหตุให้นายจ้างไม่ต้องจ่ายค่าชดเชยตาม LPA2541:119:1 และนายจ้างได้ระบุข้อเท็จจริงหรือแจ้งเหตุนั้นตาม
      LPA2541:119:4 หรือไม่
    citation_keys:
    - LPA2541:119:1
    - LPA2541:119:4
  - id: '5'
    question: ลูกจ้างได้ทำงานติดต่อกันครบระยะเวลาตามเกณฑ์ที่กำหนดไว้ใน LPA2541:118:1 หรือไม่
    citation_keys:
    - LPA2541:118:1
  common_pitfalls:
  - เข้าใจผิดว่าการเลิกจ้างในระหว่างการทดลองงานไม่ต้องจ่ายค่าชดเชย ทั้งที่สัญญาจ้างทดลองงานถือเป็นสัญญาจ้างที่ไม่มีกำหนดระยะเวลาตาม
    [LPA2541:17:2] ซึ่งหากทำงานติดต่อกันครบระยะเวลาตาม [LPA2541:118:1] ย่อมมีสิทธิได้รับค่าชดเชย
  - เข้าใจผิดว่านายจ้างสามารถยกเหตุความผิดของลูกจ้างตาม [LPA2541:119:1] ขึ้นอ้างเพื่อไม่จ่ายค่าชดเชยในภายหลังได้ ทั้งที่ไม่ได้ระบุข้อเท็จจริงนั้นไว้ในหนังสือบอกเลิกสัญญาจ้างหรือไม่ได้แจ้งให้ลูกจ้างทราบในขณะเลิกจ้างตาม
    [LPA2541:119:4]
  - เข้าใจผิดว่าสัญญาจ้างที่มีกำหนดระยะเวลาแน่นอนทุกกรณีจะได้รับการยกเว้นไม่ต้องจ่ายค่าชดเชยเมื่อสิ้นสุดสัญญา ทั้งที่ต้องเป็นงานเฉพาะเจาะจงตามลักษณะงานและเงื่อนไขระยะเวลาที่กำหนดไว้ใน
    [LPA2541:118:4] เท่านั้น
