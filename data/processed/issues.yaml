- code: contract_validity_and_non_compete
  name: ความสมบูรณ์ของสัญญาและข้อตกลงห้ามแข่งขัน
  description: การพิจารณาความสมบูรณ์ของข้อตกลงจำกัดสิทธิในการประกอบอาชีพหลังสิ้นสุดสัญญาจ้างและข้อตกลงสละสิทธิต่าง ๆ
  primary_provisions:
  - LPA2541:14/1
  - LPA2541:118
  - CCC:150
  - LRA2518:20
  provision_support:
    LPA2541:14/1:
    - dev042
    - dev132
    LPA2541:118:
    - dev042
    CCC:150:
    - dev042
    LRA2518:20:
    - dev091
  elements:
  - id: '1'
    question: เป็นสัญญาจ้างระหว่างนายจ้างกับลูกจ้าง ข้อบังคับเกี่ยวกับการทำงาน ระเบียบ หรือคำสั่งของนายจ้างที่ทำให้นายจ้างได้เปรียบลูกจ้างเกินสมควรหรือไม่
    citation_keys:
    - LPA2541:14/1:1
  - id: '2'
    question: มีการทำสัญญาจ้างแรงงานกับลูกจ้างที่ขัดหรือแย้งกับข้อตกลงเกี่ยวกับสภาพการจ้างที่มีผลใช้บังคับอยู่หรือไม่
    citation_keys:
    - LRA2518:20:1
  - id: '3'
    question: สัญญาจ้างแรงงานที่ขัดหรือแย้งกับข้อตกลงเกี่ยวกับสภาพการจ้างนั้น เป็นคุณแก่ลูกจ้างยิ่งกว่าข้อตกลงเกี่ยวกับสภาพการจ้างหรือไม่
    citation_keys:
    - LRA2518:20:1
  - id: '4'
    question: เป็นกรณีที่นายจ้างไม่ให้ลูกจ้างทำงานต่อไปและไม่จ่ายค่าจ้างให้ ไม่ว่าจะเป็นเพราะเหตุสิ้นสุดสัญญาจ้างหรือเหตุอื่นใด
      หรือเพราะเหตุที่นายจ้างไม่สามารถดำเนินกิจการต่อไปอันเป็นการเลิกจ้างหรือไม่
    citation_keys:
    - LPA2541:118:2
  - id: '5'
    question: เป็นลูกจ้างที่มีกำหนดระยะเวลาการจ้างไว้แน่นอนและเลิกจ้างตามกำหนดระยะเวลานั้น โดยเป็นงานในโครงการเฉพาะที่มิใช่งานปกติของธุรกิจ
      งานอันมีลักษณะเป็นครั้งคราว หรือเป็นไปตามฤดูกาล ซึ่งต้องแล้วเสร็จภายในระยะเวลาตามที่ระบุใน LPA2541:118:4 และได้ทำสัญญาเป็นหนังสือไว้ตั้งแต่เมื่อเริ่มจ้างหรือไม่
    citation_keys:
    - LPA2541:118:3
    - LPA2541:118:4
  - id: '6'
    question: ลูกจ้างทำงานติดต่อกันครบระยะเวลาตามที่กำหนดใน LPA2541:118:1 เพื่อมีสิทธิได้รับค่าชดเชยตามอัตราที่กฎหมายกำหนดหรือไม่
    citation_keys:
    - LPA2541:118:1
  common_pitfalls:
  - เข้าใจผิดว่าข้อตกลงหรือสัญญาจ้างที่ทำให้นายจ้างได้เปรียบลูกจ้างเกินสมควรจะตกเป็นโมฆะทั้งหมด โดยไม่ได้พิจารณาว่าศาลมีอำนาจสั่งให้มีผลบังคับเพียงเท่าที่เป็นธรรมและพอสมควรแก่กรณีตาม
    [LPA2541:14/1:1]
  - เข้าใจผิดว่านายจ้างสามารถทำสัญญาจ้างแรงงานขัดหรือแย้งกับข้อตกลงเกี่ยวกับสภาพการจ้างได้เสมอ โดยไม่ได้พิจารณาว่าต้องเป็นกรณีที่เป็นคุณแก่ลูกจ้างยิ่งกว่าตาม
    [LRA2518:20:1]
  - เข้าใจผิดว่าการจ้างงานที่มีกำหนดระยะเวลาแน่นอนทุกกรณีจะได้รับการยกเว้นไม่ต้องจ่ายค่าชดเชย โดยไม่ได้ตรวจสอบว่าเป็นงานเฉพาะโครงการ
    งานครั้งคราว หรือตามฤดูกาลที่ทำเป็นหนังสือและมีระยะเวลาเสร็จสิ้นตามที่กำหนดใน [LPA2541:118:4] หรือไม่
