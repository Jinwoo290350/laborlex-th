  - id: notice_posting
    question: นายจ้างได้ปิดประกาศแจ้งให้ลูกจ้างทราบล่วงหน้า ณ สถานประกอบกิจการในที่เปิดเผยและเห็นได้ชัดเจนเป็นเวลาติดต่อกันไม่น้อยกว่าระยะเวลาที่กำหนดใน
