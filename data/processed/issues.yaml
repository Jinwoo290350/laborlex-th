    question: นายจ้างขัดขวางการดำเนินการของสหภาพแรงงาน สหพันธ์แรงงาน หรือขัดขวางการใช้สิทธิของลูกจ้างในการเป็นสมาชิกสหภาพแรงงานตาม
      LRA2518:121:1(4) หรือไม่
    citation_keys:
    - LRA2518:121:1
  - id: '7'
    question: นายจ้างเข้าแทรกแซงในการดำเนินการของสหภาพแรงงานหรือสหพันธ์แรงงานโดยไม่มีอำนาจโดยชอบด้วยกฎหมายตาม LRA2518:121:1(5)
      หรือไม่
    citation_keys:
    - LRA2518:121:1
  - id: '8'
    question: ในระหว่างที่ข้อตกลงเกี่ยวกับสภาพการจ้างหรือคำชี้ขาดมีผลใช้บังคับ นายจ้างได้เลิกจ้างลูกจ้าง ผู้แทนลูกจ้าง กรรมการ
      อนุกรรมการ หรือสมาชิกสหภาพแรงงาน หรือกรรมการ หรืออนุกรรมการสหพันธ์แรงงาน ซึ่งเกี่ยวข้องกับข้อเรียกร้องหรือไม่
    citation_keys:
    - LRA2518:123:1
  - id: '9'
    question: บุคคลตาม LRA2518:123:1 ได้กระทำการอันเป็นข้อยกเว้นให้เลิกจ้างได้ตาม LRA2518:123:1(1), (2), (3), (4) หรือ (5)
      หรือไม่
    citation_keys:
    - LRA2518:123:1
  - id: '10'
    question: ผู้เสียหายจากการฝ่าฝืนได้ยื่นคำร้องกล่าวหาต่อคณะกรรมการแรงงานสัมพันธ์ภายในระยะเวลาที่กำหนดใน LRA2518:124:1 นับแต่วันที่มีการฝ่าฝืนหรือไม่
    citation_keys:
    - LRA2518:124:1
  common_pitfalls:
  - เข้าใจผิดว่านายจ้างสามารถเลิกจ้างหรือลงโทษกรรมการลูกจ้างได้ทันทีหากมีเหตุผลอันสมควร โดยละเลยข้อบังคับที่ต้องได้รับอนุญาตจากศาลแรงงานก่อนตาม
    [LRA2518:52:1]
  - เข้าใจผิดว่าข้อห้ามเลิกจ้างในระหว่างที่ข้อตกลงเกี่ยวกับสภาพการจ้างมีผลใช้บังคับไม่มีข้อยกเว้นเลย ทั้งที่นายจ้างสามารถเลิกจ้างได้หากลูกจ้างกระทำการตามข้อยกเว้นใน
    [LRA2518:123:1](1) ถึง (5)
