  elements:
  - id: is_investigating_offense
    question: นายจ้างทำการสอบสวนลูกจ้างซึ่งถูกกล่าวหาว่ากระทำความผิดใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: has_authority_to_suspend
    question: มีข้อบังคับเกี่ยวกับการทำงานหรือข้อตกลงเกี่ยวกับสภาพการจ้างให้อำนาจนายจ้างสั่งพักงานลูกจ้างได้ใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: is_written_order
    question: นายจ้างมีคำสั่งพักงานเป็นหนังสือใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: specifies_offense
    question: หนังสือคำสั่งพักงานมีการระบุความผิดที่กล่าวหาใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: valid_suspension_period
    question: หนังสือคำสั่งพักงานมีการกำหนดระยะเวลาพักงานไม่เกินระยะเวลาที่ระบุใน LPA2541:116:1 ใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: notified_before_suspension
    question: นายจ้างได้แจ้งให้ลูกจ้างทราบก่อนการพักงานใช่หรือไม่
    citation_keys:
    - LPA2541:116:1
  - id: paid_during_suspension
    question: นายจ้างจ่ายเงินให้แก่ลูกจ้างในระหว่างการพักงานในอัตราไม่น้อยกว่าอัตราที่กำหนดใน LPA2541:116:2 ของค่าจ้างในวันทำงานที่ลูกจ้างได้รับก่อนถูกสั่งพักงานใช่หรือไม่
    citation_keys:
    - LPA2541:116:2
  common_pitfalls:
  - เข้าใจผิดว่านายจ้างมีอำนาจสั่งพักงานลูกจ้างเพื่อทำการสอบสวนได้ทันทีโดยไม่ต้องมีข้อบังคับเกี่ยวกับการทำงานหรือข้อตกลงเกี่ยวกับสภาพการจ้างให้อำนาจไว้ตาม
    [LPA2541:116:1]
  - เข้าใจผิดว่านายจ้างสามารถสั่งพักงานด้วยวาจาได้โดยไม่ต้องทำเป็นหนังสือระบุความผิดและกำหนดระยะเวลาตาม [LPA2541:116:1]
  - เข้าใจผิดว่านายจ้างสามารถสั่งพักงานเพื่อทำการสอบสวนได้เกินระยะเวลาที่กำหนดไว้ใน [LPA2541:116:1]
  - เข้าใจผิดว่านายจ้างไม่ต้องจ่ายเงินใดๆ ให้แก่ลูกจ้างในระหว่างการพักงานเพื่อทำการสอบสวนความผิดตาม [LPA2541:116:2]
