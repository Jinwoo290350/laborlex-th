    question: การลาป่วยของลูกจ้างเป็นการลาป่วยตั้งแต่จำนวนวันทำงานที่กำหนดใน LPA2541:32:1 ขึ้นไปใช่หรือไม่
    citation_keys:
    - LPA2541:32:1
  - id: medical_certificate_provided
    question: ในกรณีที่ลาป่วยตั้งแต่จำนวนวันทำงานที่กำหนดใน LPA2541:32:1 ขึ้นไป ลูกจ้างได้แสดงใบรับรองของแพทย์แผนปัจจุบันชั้นหนึ่งหรือของสถานพยาบาลของทางราชการ
      หรือได้ชี้แจงให้นายจ้างทราบในกรณีที่ไม่อาจแสดงใบรับรองดังกล่าวได้ใช่หรือไม่
    citation_keys:
    - LPA2541:32:1
  - id: employer_provided_doctor
    question: ในกรณีที่นายจ้างจัดแพทย์ไว้ ลูกจ้างได้ให้แพทย์ที่นายจ้างจัดไว้เป็นผู้ออกใบรับรอง เว้นแต่ลูกจ้างไม่สามารถให้แพทย์นั้นตรวจได้
      ใช่หรือไม่
    citation_keys:
    - LPA2541:32:2
  common_pitfalls:
  - เข้าใจผิดว่าวันที่ลูกจ้างไม่สามารถทำงานได้เนื่องจากประสบอันตรายหรือเจ็บป่วยเนื่องจากการทำงาน หรือวันลาเพื่อคลอดบุตร ให้นับรวมเป็นวันลาป่วยตาม
    [LPA2541:32:3]
  - เข้าใจผิดว่าลูกจ้างไม่มีสิทธิลาป่วยหากไม่สามารถแสดงใบรับรองแพทย์ได้ในกรณีที่ลาป่วยตั้งแต่จำนวนวันทำงานที่กำหนดใน [LPA2541:32:1]
    ขึ้นไป โดยไม่ได้พิจารณาว่าลูกจ้างได้ชี้แจงให้นายจ้างทราบแล้วหรือไม่ตามที่ระบุใน [LPA2541:32:1]
  - เข้าใจผิดว่าลูกจ้างสามารถเลือกใช้ใบรับรองจากแพทย์อื่นได้ในกรณีที่นายจ้างได้จัดแพทย์ไว้ให้ โดยไม่มีเหตุผลอันสมควรที่ทำให้ไม่สามารถให้แพทย์ที่นายจ้างจัดไว้ตรวจได้ตาม
    [LPA2541:32:2]
