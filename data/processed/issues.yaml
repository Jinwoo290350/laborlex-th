  elements:
  - id: element_1
    question: มีการแจ้งข้อเรียกร้องต่ออีกฝ่ายหนึ่งและข้อพิพาทแรงงานนั้นเป็นข้อพิพาทแรงงานที่ตกลงกันไม่ได้แล้วใช่หรือไม่
    citation_keys:
    - LRA2518:34:1
  - id: element_2
    question: ไม่มีฝ่ายใดฝ่ายหนึ่งที่ปฏิบัติหน้าที่ตามข้อตกลงหรือคำชี้ขาดของผู้ชี้ขาดข้อพิพาทแรงงานแล้วใช่หรือไม่
    citation_keys:
    - LRA2518:34:1
  - id: element_3
    question: ข้อพิพาทแรงงานไม่ได้อยู่ในระหว่างการพิจารณาวินิจฉัยของคณะกรรมการแรงงานสัมพันธ์ หรือคำวินิจฉัยของรัฐมนตรี หรือคำชี้ขาดของคณะกรรมการแรงงานสัมพันธ์
      หรืออยู่ระหว่างการชี้ขาดของผู้ชี้ขาดข้อพิพาทแรงงานใช่หรือไม่
    citation_keys:
    - LRA2518:34:1
  - id: element_4
    question: นายจ้างหรือลูกจ้างได้แจ้งเป็นหนังสือให้พนักงานประนอมข้อพิพาทแรงงานและอีกฝ่ายหนึ่งทราบล่วงหน้าตามระยะเวลาที่กำหนดในกฎหมายนับแต่เวลาที่รับแจ้งก่อนการปิดงานหรือนัดหยุดงานใช่หรือไม่
    citation_keys:
    - LRA2518:34:2
  - id: element_5
    question: ลูกจ้าง ผู้แทนลูกจ้าง กรรมการ อนุกรรมการ หรือสมาชิกสหภาพแรงงาน หรือกรรมการ หรืออนุกรรมการสหพันธ์แรงงานที่เกี่ยวข้องกับข้อเรียกร้อง
      ไม่ได้สนับสนุนหรือก่อเหตุการณ์นัดหยุดงานในระหว่างการเจรจา การไกล่เกลี่ย หรือการชี้ขาดข้อพิพาทแรงงานใช่หรือไม่
    citation_keys:
    - LRA2518:31:2
  - id: element_6
    question: การนัดหยุดงานหรือการกระทำที่เกี่ยวข้องของสหภาพแรงงานและลูกจ้าง เป็นไปเพื่อประโยชน์ของสมาชิกอันมิใช่กิจการเกี่ยวกับการเมือง
      และไม่เป็นความผิดทางอาญาเกี่ยวกับภัยต่อประชาชน ชีวิต ร่างกาย เสรีภาพ ชื่อเสียง หรือทรัพย์สิน หรือความผิดทางแพ่งที่เกี่ยวเนื่องกันใช่หรือไม่
    citation_keys:
    - LRA2518:99:1
    - LRA2518:99:2
  common_pitfalls:
  - เข้าใจผิดว่านายจ้างสามารถปิดงานหรือลูกจ้างสามารถนัดหยุดงานได้ทันทีที่มีข้อพิพาทแรงงานเกิดขึ้น โดยไม่ต้องแจ้งเป็นหนังสือล่วงหน้าตามระยะเวลาที่กฎหมายกำหนดตาม
    LRA2518:34:2
  - เข้าใจผิดว่าการนัดหยุดงานของลูกจ้างหรือสหภาพแรงงานจะได้รับการยกเว้นความรับผิดทางแพ่งและอาญาในทุกกรณี แม้ว่าการกระทำนั้นจะเป็นความผิดอาญาเกี่ยวกับชีวิต
    ร่างกาย เสรีภาพ หรือทรัพย์สินตาม LRA2518:99:2
  - เข้าใจผิดว่านายจ้างสามารถปิดงานหรือลูกจ้างสามารถนัดหยุดงานได้ในขณะที่ข้อพิพาทแรงงานยังอยู่ระหว่างการพิจารณาวินิจฉัยของคณะกรรมการแรงงานสัมพันธ์
    หรืออยู่ระหว่างการชี้ขาดของผู้ชี้ขาดข้อพิพาทแรงงานตาม LRA2518:34:1
