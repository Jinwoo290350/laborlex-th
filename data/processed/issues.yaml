    citation_keys:
    - LPA2541:120:1
  - id: notice_content_clarity
    question: ประกาศของนายจ้างมีข้อความชัดเจนเพียงพอที่จะเข้าใจได้ว่าลูกจ้างคนใดจะต้องถูกย้ายไปสถานที่ใดและเมื่อใดตาม LPA2541:120:1
      หรือไม่
    citation_keys:
    - LPA2541:120:1
  - id: special_severance_no_notice
    question: ในกรณีที่นายจ้างไม่ปิดประกาศล่วงหน้า นายจ้างได้จ่ายค่าชดเชยพิเศษแทนการบอกกล่าวล่วงหน้าแก่ลูกจ้างที่ไม่ประสงค์จะไปทำงาน
      ณ สถานประกอบกิจการแห่งใหม่ตามอัตราที่กำหนดใน LPA2541:120:2 หรือไม่
