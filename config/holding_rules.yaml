# Research 2026-10-11 (owner-delegated); reviewed_by: draft.
- id: HR-1
  provisions: [CCC:583]
  condition: ลูกจ้างทราบการกระทำผิดของเพื่อนร่วมงานหรือหัวหน้างานที่อาจทำให้นายจ้างเสียหาย แต่นิ่งเฉยไม่รายงานนายจ้าง (แม้ไม่ได้ร่วมกระทำ)
  outcome: เข้า ป.พ.พ. มาตรา 583 (ทำประการอื่นอันไม่สมแก่การปฏิบัติหน้าที่โดยถูกต้องและสุจริต) จึงไม่ต้องบอกกล่าวล่วงหน้า แต่ไม่ถึงขั้นทุจริตหรือจงใจทำให้นายจ้างเสียหายตามมาตรา 119 จึงยังได้ค่าชดเชย
  caveat: ไม่พบคำพิพากษาที่ถือว่าความเกรงกลัวผู้บังคับบัญชาเป็นเหตุยกเว้น ให้วินิจฉัยว่าเข้า และระบุเงื่อนไขว่าหากข้อเท็จจริงฟังได้ว่าถูกข่มขู่จนไม่อาจแจ้งได้ ผลอาจต่างไป (docs/decisions.md #28)
  cases:
  - {deka_no: 2512/2545, decided_by: own, quote: "คำว่า สุจริต ในป.พ.พ. มาตรา 583 มิได้หมายความว่าโจทก์จะต้องกระทำการโดยไม่ทุจริต"}
  - {deka_no: 6237/2545, decided_by: own, quote: "กลับนิ่งเสียไม่รายงานผู้บังคับบัญชา"}
  - {deka_no: 4554/2540, decided_by: own, quote: "เป็นเพียงการฝ่าฝืนข้อบังคับที่ไม่เป็นความผิดอย่างร้ายแรง ทั้งไม่เป็นการทุจริตต่อหน้าที่"}
- id: HR-2
  provisions: [LPA2541:119]
  condition: ลูกจ้างทำกิจการหรือเสนอบริการแข่งขันกับนายจ้าง หรือแย่งลูกค้าของนายจ้าง แม้ยังไม่มีลูกค้ารายใดไปใช้บริการ
  outcome: เป็นการจงใจทำให้นายจ้างได้รับความเสียหาย ตามมาตรา 119 วรรคหนึ่ง (2)
  caveat: ไม่พบคำพิพากษาที่จัดกรณีนี้เป็นการทุจริตต่อหน้าที่ตาม (1) โดยตรง
  cases:
  - {deka_no: 239/2545, decided_by: own, quote: "ก็ต้องถือว่าเป็นการจงใจทำให้นายจ้างได้รับความเสียหายแล้ว"}
  - {deka_no: 11096/2556, decided_by: own, quote: "โจทก์กระทำการเป็นปฏิปักษ์ต่อทางการค้าของจำเลยที่ 1 ผู้เป็นนายจ้าง"}
# HR-3 (P6): partners' liability for a ห้างหุ้นส่วนจำกัด employer's debts. Statute: ป.พ.พ. 1077 (2), 1080, 1087, 1088,
# 1095 (indexed 2026-10-11). Decisions 15199-15200/2558, 3913/2548, 2066/2545 loaded from a saved deka result page
# (data/raw/deka/extra/, src/ingest/load_cases.py --extra); ร 302/2564 and 2510/2526 were already in the DB.
- id: HR-3
  provisions: [CCC:1077, CCC:1080, CCC:1087, CCC:1088, CCC:1095]
  condition: นายจ้างเป็นห้างหุ้นส่วนจำกัด และลูกจ้างเรียกให้ผู้เป็นหุ้นส่วนรับผิดในหนี้ของห้าง เช่น ค่าจ้าง ค่าชดเชย สินจ้างแทนการบอกกล่าวล่วงหน้า
  outcome: หุ้นส่วนผู้จัดการ (หุ้นส่วนจำพวกไม่จำกัดความรับผิด) ต้องร่วมรับผิดกับห้างในบรรดาหนี้ของห้าง รวมทั้งหนี้ตามสัญญาจ้าง โดยไม่จำกัดจำนวน
    ตาม ป.พ.พ. มาตรา 1077 (2) และ 1087 · หุ้นส่วนจำพวกจำกัดความรับผิดที่มิได้สอดเข้าไปเกี่ยวข้องจัดการงานของห้าง ไม่ต้องรับผิดเป็นการส่วนตัว
    และตราบใดที่ห้างยังไม่เลิกกัน เจ้าหนี้ฟ้องผู้นั้นไม่ได้ (เมื่อเลิกแล้วฟ้องได้เพียงจำนวนตามมาตรา 1095 วรรคสอง)
  caveat: หุ้นส่วนจำพวกจำกัดความรับผิดที่สอดเข้าไปจัดการงานของห้าง — ฎีกา 15199-15200/2558 และ 2066/2545 ให้รับผิดโดยไม่จำกัดจำนวนตามมาตรา 1088
    (หนี้ละเมิดและหนี้การค้า) แต่ฎีกา 2510/2526 วินิจฉัยว่ามาตรา 1088 ไม่ครอบคลุมหนี้ที่เกิดจากความสัมพันธ์ในฐานะนายจ้างและลูกจ้าง
    จึงให้ตอบเรื่องนี้แบบมีเงื่อนไขและระบุทั้งสองแนว
  cases:
  - {deka_no: ร 302/2564, court: ศาลอุทธรณ์คดีชำนัญพิเศษ, decided_by: own, quote: "จำเลยที่ 2 จึงต้องรับผิดในบรรดาหนี้ของจำเลยที่ 1 ไม่จำกัดจำนวน"}
  - {deka_no: 15199-15200/2558, decided_by: own, quote: "จำเลยที่ 3 ในฐานะหุ้นส่วนผู้จัดการย่อมต้องร่วมรับผิดกับจำเลยที่ 4 ด้วยโดยไม่จำกัดจำนวนตามมาตรา 1077 (2) และ 1087"}
  - {deka_no: 3913/2548, decided_by: own, quote: "ซึ่งเป็นหุ้นส่วนผู้จัดการของจำเลยที่ 2 ก็ต้องร่วมรับผิดในบรรดาหนี้ของจำเลยที่ 2 โดยไม่จำกัดจำนวน"}
  - {deka_no: 15199-15200/2558, decided_by: own, quote: "ถือได้ว่าเป็นการสอดเข้าไปเกี่ยวข้องจัดการงานของจำเลยที่ 4"}
  - {deka_no: 2066/2545, decided_by: own, quote: "ถือได้ว่าจำเลยที่ 3 ซึ่งเป็นหุ้นส่วนจำพวกจำกัดความรับผิดสอดเข้าไปเกี่ยวข้องจัดการงานของจำเลยที่ 1"}
  - {deka_no: 2510/2526, decided_by: own, quote: "หุ้นส่วนจำพวกจำกัดความรับผิดไม่มีความสัมพันธ์ในฐานะนายจ้างและลูกจ้าง จึงไม่ต้องรับผิด"}
